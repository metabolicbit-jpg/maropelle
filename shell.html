<script>
/* ===== Maropelle · shell.html (v14) — پاکسازی سختِ متن + چند منبع + آزمون نسخه ===== */
var VER='v14';
var USER='metabolicbit-jpg',REPO='maropelle',BR='main';
var SRC=[
 'https://cdn.jsdelivr.net/gh/'+USER+'/'+REPO+'@'+BR+'/',
 'https://cdn.statically.io/gh/'+USER+'/'+REPO+'/'+BR+'/',
 'https://raw.githubusercontent.com/'+USER+'/'+REPO+'/'+BR+'/'
];
var MODS=[
 {p:'src/lang.js',q:'SPRITE_ORDER'},
 {p:'src/audio.js',q:'AUDIO_VER'},
 {p:'src/render.js',q:'buildBoard'},
 {p:'src/heroes.js',q:'heroMesh'},
 {p:'src/creatures.js',q:'powerZalAnim'},
 {p:'src/ui.js',q:'loadHeroSheet'},
 {p:'src/core.js',q:'usePower'},
 {p:'src/main.js',q:'boot'}
];
(function(){
  var errEl=document.getElementById('err'),loadEl=document.getElementById('load');
  var notes=[],fails=[],stale=[],done=0,cur='',blocked=false,lastErr=null,mid=0;
  function box(){errEl.style.display='block';errEl.textContent=notes.join('\n');}
  function add(m){if(notes.indexOf(m)<0){notes.push(m);box();}}
  window.__mpErr=add;
  addEventListener('error',function(e){
    var msg=(e&&(e.message||e.type))||'?',line=(e&&e.lineno)?(' — خط '+e.lineno):'';
    if(cur&&/Syntax|Invalid|Unexpected|token|left-hand/i.test(msg)){lastErr=msg;add('✖ '+cur+' ⇐ '+msg+line);}
    else if(!/__mpMark/.test(msg))add('JS'+(cur?(' ['+cur+']'):'')+': '+msg+line);
  });
  addEventListener('unhandledrejection',function(e){add('Promise: '+((e&&e.reason&&e.reason.message)||(e&&e.reason)||'?'));});
  function prog(){if(loadEl)loadEl.textContent='در حال بارگذاری… '+done+'/'+MODS.length;}
  function has(q){try{return !q||typeof window[q]!=='undefined';}catch(e){return false;}}
  function clean(x){
    x=String(x).replace(/\r\n?/g,'\n');
    var key='===== Maropelle',i1=x.indexOf(key);
    if(i1>=0){var i2=x.indexOf(key,i1+key.length);
      if(i2>=0){var cut=x.lastIndexOf('\n',i2);x=x.slice(0,cut>=0?cut:x.length);}}
    var L=x.split('\n'),st=-1,k;
    for(k=0;k<L.length&&k<40;k++){if(/^\s*\/\*/.test(L[k])){st=k;break;}}
    if(st>0)L=L.slice(st);
    L=L.filter(function(l){
      var t=l.replace(/[\u200b-\u200f\u061c\u2060\ufeff\u00ad]/g,'').trim();
      if(t==='')return true;
      var lo=t.toLowerCase();
      return !(
        /^[-=_*~•·]{3,}$/.test(t) ||
        /^-{2,}/.test(t) ||
        lo.indexOf('powered by paean')>=0 ||
        lo.indexOf('paean.ai')>=0 ||
        /^\[custom\]/.test(lo) ||
        /^mp-[a-z0-9_\-]+/.test(lo) ||
        /^#{1,6}\s*(mp-|powered by|paean)/.test(lo) ||
        lo==='paean'
      );
    });
    while(L.length&&L[0].trim()==='')L.shift();
    while(L.length&&L[L.length-1].trim()==='')L.pop();
    return L.join('\n')
      .replace(/[\u200b\u200c\u200d\u200e\u200f\u061c\u2060\ufeff\u00ad]/g,'')
      .replace(/[\u00a0\u1680\u2000\u2001\u2002\u2003\u2004\u2005\u2006\u2007\u2008\u2009\u200a\u202f\u205f\u3000]/g,' ')
      .replace(/[\u2018\u2019\u201b\u2032]/g,"'")
      .replace(/[\u201c\u201d\u201f\u2033]/g,'"');
  }
  function inject(code){var s=document.createElement('script');s.textContent=code;document.body.appendChild(s);}
  function viaSrc(url){return new Promise(function(res,rej){var s=document.createElement('script');s.src=url;s.onload=function(){res();};s.onerror=function(){rej(new Error('src'));};document.body.appendChild(s);});}
  function ensureThree(cb){
    if(window.THREE)return cb();
    var alts=['https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js','https://unpkg.com/three@0.128.0/build/three.min.js'],i=0;
    (function nx(){if(i>=alts.length){add('⚠ Three.js بارگذاری نشد');return cb();}var s=document.createElement('script');s.src=alts[i++];s.onload=function(){cb();};s.onerror=nx;document.body.appendChild(s);})();
  }
  function attempt(code,q,cb){
    if(blocked)return cb('blocked');
    lastErr=null;
    var id='m'+(++mid);
    try{inject(';window.__mpMark="'+id+'";\n'+code);}catch(e){return cb('syntax');}
    setTimeout(function(){
      var ran=(window.__mpMark===id);
      if(ran&&has(q))return cb('ok');
      if(lastErr)return cb('syntax');
      if(!ran){blocked=true;return cb('blocked');}
      cb('stale');
    },0);
  }
  function load(i){
    if(i>=MODS.length){
      if(loadEl)loadEl.style.display='none';
      if(!has('boot'))add('⚠ بازی کامل بارگذاری نشد. ناقص: '+(fails.join(' ، ')||'—'));
      if(stale.length)add('⚠ نسخهٔ کهنه روی CDN: '+stale.join(' ، ')+' — کش jsDelivr را Purge کن.');
      if(fails.length&&has('boot'))add('⚠ ناقص: '+fails.join(' ، '));
      return;
    }
    var m=MODS[i],p=m.p,q=m.q,key='mp_'+VER+'_'+p;
    if(i>0&&has(q)){done++;prog();return load(i+1);}
    cur=p;
    var cached=null;try{cached=localStorage.getItem(key);}catch(e){}
    function fromSrc(k){
      if(k>=SRC.length){fails.push(p);cur='';return load(i+1);}
      fetch(SRC[k]+p,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text();}).then(function(txt){
        var t=clean(txt);
        attempt(t,q,function(res){
          if(res==='ok'){try{localStorage.setItem(key,t);}catch(e){}done++;prog();return load(i+1);}
          if(res==='syntax'){fails.push(p);cur='';return load(i+1);}
          if(res==='stale'){if(stale.indexOf(p)<0)stale.push(p);return fromSrc(k+1);}
          viaSrc(SRC[k]+p).then(function(){ if(has(q)){done++;prog();load(i+1);} else fromSrc(k+1); })
            .catch(function(){fromSrc(k+1);});
        });
      }).catch(function(){fromSrc(k+1);});
    }
    if(cached){
      var c=clean(cached);
